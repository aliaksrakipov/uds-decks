<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UDS — редактор презентаций</title>
<style>
@font-face{font-family:'Unbounded';font-weight:800;font-style:normal;font-display:swap;src:url(assets/fonts/unbounded-800.woff2) format('woff2');}
@font-face{font-family:'Inter';font-weight:100 900;font-style:normal;font-display:swap;src:url(assets/fonts/inter-var.woff2) format('woff2');}
*{box-sizing:border-box;margin:0}
body{
  --bg:#0E0E15; --panel:rgba(255,255,255,.045); --line:rgba(255,255,255,.13);
  --ink:#EDEEF4; --mut:#a9aec2; --mut2:#8b90a5;
  --acc:#A78BFA; --acc2:#7C3AED; --acc-dim:rgba(124,58,237,.20);
  background:
    radial-gradient(90% 60% at 85% -10%, #251F3E 0%, transparent 55%),
    radial-gradient(70% 50% at 5% 110%, #1B1730 0%, transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink); font-family:"Inter",-apple-system,sans-serif;
  min-height:100vh; padding:48px 24px 80px;
}
.wrap{max-width:640px;margin:0 auto}
.logo{font-family:"Unbounded",sans-serif;font-weight:800;font-size:22px}
.logo span{color:var(--mut2);font-weight:400;font-family:"Inter",sans-serif;margin-left:10px;font-size:17px}
h1{font-family:"Unbounded",sans-serif;font-weight:800;font-size:clamp(24px,4vw,34px);line-height:1.2;margin-top:36px}
.sub{color:var(--mut);font-size:15.5px;margin-top:12px;line-height:1.5}
.decks{display:flex;flex-direction:column;gap:12px;margin-top:28px}
.deck-card{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:18px 22px;
  border-radius:14px;background:var(--panel);border:1px solid var(--line);cursor:pointer;transition:.2s;text-align:left}
.deck-card:hover{border-color:rgba(167,139,250,.5)}
.deck-card .name{font-family:"Unbounded",sans-serif;font-weight:800;font-size:16px}
.deck-card .hint{color:var(--mut2);font-size:13px;margin-top:4px}
.deck-card .arrow{color:var(--acc);font-size:20px;flex:none}
.slides{margin-top:26px;display:flex;flex-direction:column;gap:8px}
.slide-row{display:flex;align-items:center;gap:14px;padding:12px 16px;border-radius:12px;
  background:var(--panel);border:1px solid var(--line)}
.slide-row.locked{opacity:.55}
.slide-row .num{width:24px;flex:none;color:var(--mut2);font-size:13px;font-variant-numeric:tabular-nums}
.slide-row .title{flex:1;font-size:14.5px}
.slide-row .mv{display:flex;gap:4px;flex:none}
.slide-row button.mv-btn{width:30px;height:30px;border-radius:8px;border:1px solid var(--line);background:transparent;
  color:var(--ink);cursor:pointer;font-size:14px;line-height:1;display:grid;place-items:center}
.slide-row button.mv-btn:hover:not(:disabled){border-color:rgba(167,139,250,.5);color:var(--acc)}
.slide-row button.mv-btn:disabled{opacity:.3;cursor:default}
.actions{display:flex;gap:10px;margin-top:24px;flex-wrap:wrap}
button.send{padding:14px 26px;border-radius:99px;border:none;cursor:pointer;
  background:linear-gradient(120deg,var(--acc2),var(--acc));color:#fff;font:600 16px/1 "Inter",sans-serif}
button.send:hover{filter:brightness(1.12)}
button.send:disabled{opacity:.5;cursor:default;filter:none}
button.ghost{padding:14px 22px;border-radius:99px;border:1px solid var(--line);background:transparent;
  color:var(--mut);font:600 15px/1 "Inter",sans-serif;cursor:pointer}
button.ghost:hover{border-color:rgba(167,139,250,.5);color:var(--ink)}
.msg{padding:14px 18px;border-radius:12px;font-size:14.5px;line-height:1.5;display:none;margin-top:18px}
.msg.err{display:block;background:rgba(220,60,80,.12);border:1px solid rgba(220,60,80,.4);color:#f0aab6}
.msg.ok{display:block;background:rgba(60,200,120,.1);border:1px solid rgba(60,200,120,.35);color:#9fe0bb}
.back{display:inline-block;margin-top:28px;color:var(--mut2);font-size:14px;text-decoration:none}
.back:hover{color:var(--ink)}
[hidden]{display:none!important}
</style>
</head><body>
<div class="wrap">
  <div class="logo">uds<span>Partner · редактор</span></div>
  <h1 id="h1">Редактор презентаций</h1>
  <p class="sub" id="intro">Загружаю…</p>

  <div id="pickBlock" hidden>
    <div class="decks" id="decks"></div>
  </div>

  <div id="orderBlock" hidden>
    <div class="slides" id="slides"></div>
    <div class="actions">
      <button class="send" id="saveOrder" type="button">Сохранить порядок</button>
      <button class="ghost" id="backToPick" type="button">← К выбору презентации</button>
    </div>
  </div>

  <div class="msg" id="msg"></div>
  <a class="back" href="index.html">← Назад в каталог</a>
</div>

<script src="config.js"></script>
<script src="engine/auth.js"></script>
<script>
(function(){
  var cfg = window.SITE_CONFIG || {};
  var msg = document.getElementById('msg');
  var intro = document.getElementById('intro');
  function show(kind, html){ msg.className = 'msg ' + kind; msg.innerHTML = html; }
  function clearMsg(){ msg.className = 'msg'; msg.innerHTML = ''; }

  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
    show('err', 'Редактор пока не подключён к базе.');
    return;
  }
  if (!window.UdsAuth.isLoggedIn()) {
    location.href = 'login.html';
    return;
  }

  var DECKS = [
    { id: 'produkt', name: 'Продукт UDS', hint: '20 слайдов' },
    { id: 'marketing', name: 'Marketing', hint: '41 слайд' },
    { id: 'pervichka', name: 'Первичка', hint: '20 слайдов' }
  ];

  var partnerId = null;
  var currentDeck = null;
  var currentData = null;   // весь jsonb из deck_customizations (сохраняем прочие ключи при записи)
  var currentSlides = null; // рабочий массив редактируемых слайдов [{id,title}]

  var pickBlock = document.getElementById('pickBlock');
  var orderBlock = document.getElementById('orderBlock');

  // ---------- узнаём, к какому партнёру привязан этот логин ----------
  window.UdsAuth.authFetch('/rest/v1/partner_accounts?select=partner_id')
    .then(function(r){ return r.json(); })
    .then(function(rows){
      if (!Array.isArray(rows) || !rows.length) {
        intro.textContent = 'Аккаунт ещё не привязан к профилю партнёра.';
        show('err', 'Сначала привяжись к своему профилю в <a href="login.html">личном кабинете</a>.');
        return;
      }
      partnerId = rows[0].partner_id;
      showPicker();
    })
    .catch(function(){
      show('err', 'Не получилось проверить вход — обнови страницу.');
    });

  function showPicker(){
    intro.textContent = 'Выбери презентацию, порядок слайдов в которой хочешь настроить под себя.';
    pickBlock.hidden = false;
    orderBlock.hidden = true;
    document.getElementById('h1').textContent = 'Редактор презентаций';
    var wrap = document.getElementById('decks');
    wrap.innerHTML = '';
    DECKS.forEach(function(d){
      var btn = document.createElement('button');
      btn.className = 'deck-card';
      btn.innerHTML = '<div><div class="name">' + d.name + '</div><div class="hint">' + d.hint + '</div></div><div class="arrow">→</div>';
      btn.onclick = function(){ openDeck(d); };
      wrap.appendChild(btn);
    });
  }
  document.getElementById('backToPick').onclick = function(){ clearMsg(); showPicker(); };

  function openDeck(d){
    clearMsg();
    currentDeck = d.id;
    document.getElementById('h1').textContent = d.name;
    intro.textContent = 'Загружаю слайды…';
    pickBlock.hidden = true;
    orderBlock.hidden = false;
    document.getElementById('slides').innerHTML = '';

    Promise.all([
      fetch('decks/' + d.id + '.slides.json').then(function(r){ return r.json(); }),
      window.UdsAuth.authFetch('/rest/v1/deck_customizations?select=data&partner_id=eq.' +
        encodeURIComponent(partnerId) + '&deck=eq.' + encodeURIComponent(d.id))
        .then(function(r){ return r.json(); })
    ]).then(function(res){
      var manifest = res[0] || [];
      var savedRow = (res[1] && res[1][0]) || null;
      currentData = (savedRow && savedRow.data) || {};
      var savedOrder = currentData.order;

      var eligible = manifest.filter(function(s){ return !s.locked; });
      var byId = {};
      eligible.forEach(function(s){ byId[s.id] = s; });

      if (Array.isArray(savedOrder) && savedOrder.length) {
        // сначала то, что партнёр уже расставлял (в его порядке), потом —
        // всё, что появилось в базовой деке позже и ещё не встречалось
        var seen = {};
        currentSlides = [];
        savedOrder.forEach(function(sid){
          if (byId[sid] && !seen[sid]) { currentSlides.push(byId[sid]); seen[sid] = true; }
        });
        eligible.forEach(function(s){ if (!seen[s.id]) currentSlides.push(s); });
      } else {
        currentSlides = eligible.slice();
      }

      intro.textContent = 'Стрелками переставь слайды в нужном порядке — так они пойдут в твоей презентации.';
      renderSlides();
    }).catch(function(){
      show('err', 'Не получилось загрузить слайды — обнови страницу.');
    });
  }

  function renderSlides(){
    var wrap = document.getElementById('slides');
    wrap.innerHTML = '';
    currentSlides.forEach(function(s, i){
      var row = document.createElement('div');
      row.className = 'slide-row';
      row.innerHTML =
        '<div class="num">' + (i + 1) + '</div>' +
        '<div class="title">' + s.title + '</div>' +
        '<div class="mv">' +
          '<button type="button" class="mv-btn" data-dir="-1" ' + (i === 0 ? 'disabled' : '') + '>↑</button>' +
          '<button type="button" class="mv-btn" data-dir="1" ' + (i === currentSlides.length - 1 ? 'disabled' : '') + '>↓</button>' +
        '</div>';
      var buttons = row.querySelectorAll('.mv-btn');
      buttons[0].onclick = function(){ moveSlide(i, -1); };
      buttons[1].onclick = function(){ moveSlide(i, 1); };
      wrap.appendChild(row);
    });
  }

  function moveSlide(i, dir){
    var j = i + dir;
    if (j < 0 || j >= currentSlides.length) return;
    var tmp = currentSlides[i];
    currentSlides[i] = currentSlides[j];
    currentSlides[j] = tmp;
    renderSlides();
  }

  document.getElementById('saveOrder').onclick = function(){
    clearMsg();
    var btn = document.getElementById('saveOrder');
    btn.disabled = true; btn.textContent = 'Сохраняю…';
    var newData = {};
    for (var k in currentData) newData[k] = currentData[k];
    newData.order = currentSlides.map(function(s){ return s.id; });
    window.UdsAuth.authFetch('/rest/v1/deck_customizations', {
      method: 'POST',
      headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: JSON.stringify({ partner_id: partnerId, deck: currentDeck, data: newData })
    }).then(function(r){
      if (!r.ok) return r.json().then(function(j){ throw new Error((j && j.message) || 'Ошибка'); });
      currentData = newData;
      show('ok', '✅ Порядок сохранён — открой свою ссылку на презентацию, чтобы проверить.');
      btn.disabled = false; btn.textContent = 'Сохранить порядок';
    }).catch(function(err){
      show('err', window.UdsAuth.translateError(err.message));
      btn.disabled = false; btn.textContent = 'Сохранить порядок';
    });
  };
})();
</script>
</body></html>
