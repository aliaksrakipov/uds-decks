<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UDS — добавить спикера</title>
<style>
@font-face{font-family:'Unbounded';font-weight:800;font-style:normal;font-display:swap;src:url(assets/fonts/unbounded-800.woff2) format('woff2');}
@font-face{font-family:'Inter';font-weight:100 900;font-style:normal;font-display:swap;src:url(assets/fonts/inter-var.woff2) format('woff2');}
*{box-sizing:border-box;margin:0}
body{
  --bg:#0E0E15; --panel:rgba(255,255,255,.045); --line:rgba(255,255,255,.13);
  --ink:#EDEEF4; --mut:#a9aec2; --mut2:#8b90a5;
  --acc:#A78BFA; --acc2:#7C3AED; --acc-dim:rgba(124,58,237,.20);
  background:
    radial-gradient(90% 60% at 85% -10%, #251F3E 0%, transparent 55%),
    radial-gradient(70% 50% at 5% 110%, #1B1730 0%, transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink); font-family:"Inter",-apple-system,sans-serif;
  min-height:100vh; padding:48px 24px 80px;
}
.wrap{max-width:640px;margin:0 auto}
.logo{font-family:"Unbounded",sans-serif;font-weight:800;font-size:22px}
.logo span{color:var(--mut2);font-weight:400;font-family:"Inter",sans-serif;margin-left:10px;font-size:17px}
h1{font-family:"Unbounded",sans-serif;font-weight:800;font-size:clamp(24px,4vw,34px);line-height:1.2;margin-top:36px}
.sub{color:var(--mut);font-size:15.5px;margin-top:12px;line-height:1.5}
form{margin-top:32px;display:flex;flex-direction:column;gap:18px}
label{display:flex;flex-direction:column;gap:7px;font-size:13.5px;color:var(--mut);font-weight:600}
label b{color:var(--ink)}
label small{font-weight:400;color:var(--mut2)}
input[type=text],textarea{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--ink);
  font:400 15px/1.45 "Inter",sans-serif;padding:12px 14px;outline:none}
input[type=text]:focus,textarea:focus{border-color:rgba(167,139,250,.55)}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{
  -webkit-text-fill-color:var(--ink); caret-color:var(--ink);
  -webkit-box-shadow:0 0 0 1000px var(--panel) inset; box-shadow:0 0 0 1000px var(--panel) inset;
  transition:background-color 9999s ease-in-out 0s;
}
textarea{min-height:110px;resize:vertical}
.photo-row{display:flex;align-items:center;gap:16px}
.photo-prev{width:84px;height:84px;border-radius:16px;background:var(--acc-dim);border:1px solid var(--line);
  display:grid;place-items:center;color:var(--mut2);font-size:12px;overflow:hidden;flex:0 0 auto}
.photo-prev img{width:100%;height:100%;object-fit:cover;object-position:50% 15%}
.file-btn{padding:10px 18px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--mut);
  font:600 14px/1 "Inter",sans-serif;cursor:pointer}
.file-btn:hover{border-color:rgba(167,139,250,.5);color:var(--ink)}
button.send{margin-top:6px;padding:14px 26px;border-radius:99px;border:none;cursor:pointer;
  background:linear-gradient(120deg,var(--acc2),var(--acc));color:#fff;font:600 16px/1 "Inter",sans-serif}
button.send:hover{filter:brightness(1.12)}
button.send:disabled{opacity:.5;cursor:default;filter:none}
.msg{padding:14px 18px;border-radius:12px;font-size:14.5px;line-height:1.5;display:none}
.msg.err{display:block;background:rgba(220,60,80,.12);border:1px solid rgba(220,60,80,.4);color:#f0aab6}
.msg.ok{display:block;background:rgba(60,200,120,.1);border:1px solid rgba(60,200,120,.35);color:#9fe0bb}
.msg a{color:var(--acc)}
.back{display:inline-block;margin-top:28px;color:var(--mut2);font-size:14px;text-decoration:none}
.back:hover{color:var(--ink)}
</style>
</head><body>
<div class="wrap">
  <div class="logo">uds<span>Partner · новый спикер</span></div>
  <h1>Добавить себя в каталог</h1>
  <p class="sub">Заполни анкету — и презентации будут открываться с твоей визиткой. Кодовое слово спроси у Александра Ракипова (<a href="https://t.me/aliaksrakipov" style="color:var(--acc)">@aliaksrakipov</a>).</p>

  <form id="f">
    <label><b>Кодовое слово</b>
      <input type="text" id="secret" autocomplete="off" required>
    </label>
    <label><b>Имя и фамилия</b>
      <input type="text" id="name" placeholder="Иван Иванов" required>
    </label>
    <label><b>Подпись под именем</b><small>Например: «Партнёр компании UDS · предприниматель»</small>
      <input type="text" id="role" placeholder="Партнёр компании UDS" required>
    </label>
    <label><b>Регалии для визитки</b><small>Каждая с новой строки, 2–5 пунктов: опыт, статусы, достижения</small>
      <textarea id="facts" placeholder="Партнёр UDS с 2026 года&#10;10 лет в продажах&#10;..."></textarea>
    </label>
    <label><b>Telegram</b><small>Без @, необязательно — покажется на слайде контактов</small>
      <input type="text" id="tg" placeholder="username">
    </label>
    <label><b>Фото</b><small>Вертикальное или квадратное, лицо ближе к верху кадра</small>
      <div class="photo-row">
        <div class="photo-prev" id="prev">нет фото</div>
        <button type="button" class="file-btn" id="pick">Выбрать файл</button>
        <input type="file" id="file" accept="image/*" style="display:none">
      </div>
    </label>
    <div class="msg" id="msg"></div>
    <button class="send" id="send" type="submit">Добавить в каталог</button>
  </form>

  <a class="back" href="index.html">← Назад в каталог</a>
</div>

<script src="config.js"></script>
<script>
(function(){
  var cfg = window.SITE_CONFIG || {};
  var msg = document.getElementById('msg');
  var photoData = null; // data:image/jpeg;base64,...

  function show(kind, html){ msg.className = 'msg ' + kind; msg.innerHTML = html; }

  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
    show('err', 'Форма ещё не подключена к базе — добавление пока через Александра.');
    document.getElementById('send').disabled = true;
  }

  // фото: ресайз на клиенте до высоты 1000, JPEG
  document.getElementById('pick').onclick = function(){ document.getElementById('file').click(); };
  document.getElementById('file').onchange = function(e){
    var f = e.target.files[0];
    if (!f) return;
    var img = new Image();
    img.onload = function(){
      var mh = 1000, k = Math.min(1, mh / img.height);
      var cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
      var q = 0.82;
      photoData = cv.toDataURL('image/jpeg', q);
      while (photoData.length > 350000 && q > 0.4) { // держим до ~350КБ
        q -= 0.12;
        photoData = cv.toDataURL('image/jpeg', q);
      }
      document.getElementById('prev').innerHTML = '<img src="' + photoData + '">';
      URL.revokeObjectURL(img.src);
    };
    img.src = URL.createObjectURL(f);
  };

  // транслит имени в id-слаг
  var TR = {а:'a',б:'b',в:'v',г:'g',д:'d',е:'e',ё:'e',ж:'zh',з:'z',и:'i',й:'i',к:'k',л:'l',м:'m',
    н:'n',о:'o',п:'p',р:'r',с:'s',т:'t',у:'u',ф:'f',х:'h',ц:'c',ч:'ch',ш:'sh',щ:'sch',ъ:'',
    ы:'y',ь:'',э:'e',ю:'yu',я:'ya'};
  function slug(name){
    return name.toLowerCase().split('').map(function(c){
      if (/[a-z0-9]/.test(c)) return c;
      if (TR[c] !== undefined) return TR[c];
      return '-';
    }).join('').replace(/-+/g, '-').replace(/^-|-$/g, '').slice(0, 30);
  }

  document.getElementById('f').onsubmit = function(e){
    e.preventDefault();
    var name = document.getElementById('name').value.trim();
    var facts = document.getElementById('facts').value.split('\n')
      .map(function(s){ return s.trim().replace(/^[-•·]\s*/, ''); })
      .filter(Boolean).slice(0, 5);
    var body = {
      secret: document.getElementById('secret').value.trim(),
      p_id: slug(name),
      p_name: name,
      p_role: document.getElementById('role').value.trim(),
      p_facts: facts,
      p_tg: document.getElementById('tg').value.trim().replace(/^@/, ''),
      p_photo: photoData
    };
    if (!body.p_id) { show('err', 'Имя пустое или из него не собрался адрес.'); return; }
    var btn = document.getElementById('send');
    btn.disabled = true; btn.textContent = 'Отправляю…';
    fetch(cfg.supabaseUrl + '/rest/v1/rpc/add_partner', {
      method: 'POST',
      headers: {
        apikey: cfg.supabaseAnonKey,
        Authorization: 'Bearer ' + cfg.supabaseAnonKey,
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(body)
    }).then(function(r){ return r.json().then(function(j){ return { ok: r.ok, j: j }; }); })
      .then(function(res){
        if (res.ok) {
          show('ok', '✅ Готово! Ты в каталоге. <a href="index.html?p=' + body.p_id + '">Открыть каталог с твоей визиткой</a>');
          btn.textContent = 'Добавлено';
        } else {
          var m = (res.j && res.j.message) || 'что-то пошло не так';
          if (/wrong secret/.test(m)) m = 'Неверное кодовое слово.';
          if (/photo too big/.test(m)) m = 'Фото слишком тяжёлое — попробуй другое.';
          show('err', m);
          btn.disabled = false; btn.textContent = 'Добавить в каталог';
        }
      })
      .catch(function(){
        show('err', 'Сеть недоступна — попробуй ещё раз.');
        btn.disabled = false; btn.textContent = 'Добавить в каталог';
      });
  };
})();
</script>
</body></html>
