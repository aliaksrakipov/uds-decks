<!doctype html>
<html lang="ru"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>UDS — новый пароль</title>
<style>
@font-face{font-family:'Unbounded';font-weight:800;font-style:normal;font-display:swap;src:url(assets/fonts/unbounded-800.woff2) format('woff2');}
@font-face{font-family:'Inter';font-weight:100 900;font-style:normal;font-display:swap;src:url(assets/fonts/inter-var.woff2) format('woff2');}
*{box-sizing:border-box;margin:0}
body{
  --bg:#0E0E15; --panel:rgba(255,255,255,.045); --line:rgba(255,255,255,.13);
  --ink:#EDEEF4; --mut:#a9aec2; --mut2:#8b90a5;
  --acc:#A78BFA; --acc2:#7C3AED; --acc-dim:rgba(124,58,237,.20);
  background:
    radial-gradient(90% 60% at 85% -10%, #251F3E 0%, transparent 55%),
    radial-gradient(70% 50% at 5% 110%, #1B1730 0%, transparent 60%),
    var(--bg);
  background-attachment:fixed;
  color:var(--ink); font-family:"Inter",-apple-system,sans-serif;
  min-height:100vh; padding:48px 24px 80px;
}
.wrap{max-width:520px;margin:0 auto}
.logo{font-family:"Unbounded",sans-serif;font-weight:800;font-size:22px}
.logo span{color:var(--mut2);font-weight:400;font-family:"Inter",sans-serif;margin-left:10px;font-size:17px}
h1{font-family:"Unbounded",sans-serif;font-weight:800;font-size:clamp(24px,4vw,34px);line-height:1.2;margin-top:36px}
.sub{color:var(--mut);font-size:15.5px;margin-top:12px;line-height:1.5}
form{margin-top:26px;display:flex;flex-direction:column;gap:16px}
label{display:flex;flex-direction:column;gap:7px;font-size:13.5px;color:var(--mut);font-weight:600}
label b{color:var(--ink)}
input[type=password]{
  background:var(--panel);border:1px solid var(--line);border-radius:12px;color:var(--ink);
  font:400 15px/1.45 "Inter",sans-serif;padding:12px 14px;outline:none}
input:focus{border-color:rgba(167,139,250,.55)}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus{
  -webkit-text-fill-color:var(--ink); caret-color:var(--ink);
  -webkit-box-shadow:0 0 0 1000px var(--panel) inset; box-shadow:0 0 0 1000px var(--panel) inset;
  transition:background-color 9999s ease-in-out 0s;
}
button.send{margin-top:6px;padding:14px 26px;border-radius:99px;border:none;cursor:pointer;
  background:linear-gradient(120deg,var(--acc2),var(--acc));color:#fff;font:600 16px/1 "Inter",sans-serif}
button.send:hover{filter:brightness(1.12)}
button.send:disabled{opacity:.5;cursor:default;filter:none}
.msg{padding:14px 18px;border-radius:12px;font-size:14.5px;line-height:1.5;display:none;margin-top:18px}
.msg.err{display:block;background:rgba(220,60,80,.12);border:1px solid rgba(220,60,80,.4);color:#f0aab6}
.msg.ok{display:block;background:rgba(60,200,120,.1);border:1px solid rgba(60,200,120,.35);color:#9fe0bb}
.msg a{color:var(--acc)}
.back{display:inline-block;margin-top:28px;color:var(--mut2);font-size:14px;text-decoration:none}
.back:hover{color:var(--ink)}
[hidden]{display:none!important}
</style>
</head><body>
<div class="wrap">
  <div class="logo">uds<span>Partner · кабинет</span></div>
  <h1>Новый пароль</h1>
  <p class="sub" id="intro">Придумай новый пароль для входа.</p>

  <form id="f">
    <label><b>Новый пароль</b>
      <input type="password" id="password" autocomplete="new-password" required minlength="6">
    </label>
    <label><b>Повтори пароль</b>
      <input type="password" id="password2" autocomplete="new-password" required minlength="6">
    </label>
    <button class="send" id="send" type="submit">Сохранить пароль</button>
  </form>

  <div class="msg" id="msg"></div>
  <a class="back" href="login.html">← Назад в кабинет</a>
</div>

<script src="config.js"></script>
<script src="engine/auth.js"></script>
<script>
(function(){
  var cfg = window.SITE_CONFIG || {};
  var msg = document.getElementById('msg');
  function show(kind, html){ msg.className = 'msg ' + kind; msg.innerHTML = html; }

  if (!cfg.supabaseUrl || !cfg.supabaseAnonKey) {
    show('err', 'Кабинет пока не подключён к базе.');
    document.getElementById('f').style.display = 'none';
    return;
  }

  // Supabase кладёт токен восстановления во фрагмент ссылки из письма:
  // reset-password.html#access_token=...&refresh_token=...&type=recovery
  var hash = {};
  location.hash.replace(/^#/, '').split('&').forEach(function(pair){
    var kv = pair.split('=');
    if (kv[0]) hash[kv[0]] = decodeURIComponent(kv[1] || '');
  });

  if (hash.type !== 'recovery' || !hash.access_token) {
    document.getElementById('intro').textContent = 'Ссылка недействительна или устарела.';
    document.getElementById('f').style.display = 'none';
    show('err', 'Запроси новую ссылку на странице входа — там есть «Забыл пароль?».');
    return;
  }

  document.getElementById('f').onsubmit = function(e){
    e.preventDefault();
    var p1 = document.getElementById('password').value;
    var p2 = document.getElementById('password2').value;
    if (p1 !== p2) { show('err', 'Пароли не совпадают.'); return; }
    var btn = document.getElementById('send');
    btn.disabled = true; btn.textContent = 'Сохраняю…';
    window.UdsAuth.updatePasswordWithToken(hash.access_token, p1).then(function(user){
      window.UdsAuth.adoptSession(hash.access_token, hash.refresh_token, user);
      show('ok', '✅ Пароль обновлён. Переходим в кабинет…');
      setTimeout(function(){ location.href = 'login.html'; }, 1200);
    }).catch(function(err){
      show('err', window.UdsAuth.translateError(err.message));
      btn.disabled = false; btn.textContent = 'Сохранить пароль';
    });
  };
})();
</script>
</body></html>
